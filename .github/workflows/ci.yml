name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Run the pipeline
        run: python -m pipelines run all
      - name: Check that the run changed no tracked files
        run: git diff --exit-code
      - name: Explain chart differences
        # Runs only when a step above failed. If a chart was redrawn, this
        # shows how far the new picture is from the one in the repository.
        if: failure()
        run: python tools/compare_charts.py
