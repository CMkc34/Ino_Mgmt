# Pipeline configuration.
# Change parameters here, not in the code (requirement R-1.4).

trends:
  source: OpenAlex
  first_year: 2015        # complete calendar years only (decision OD-3)
  last_year: 2025
  volume_window_years: 3  # "volume" = works in the last 3 complete years
  growth_window_years: 5  # "momentum" = compound annual growth over 5 years

  # Only these types of work are counted. Editorials, peer-review records,
  # whole books, datasets and similar are left out.
  work_types: [article, conference-paper, review, preprint, book-chapter, dissertation]

  # How a sub-topic is counted (see docs/design/trend-scan-method.md):
  #
  #   title_terms     must be found in the TITLE, so the work is about the topic
  #   title_also      optional second block that must also be in the title
  #   title_ai_terms  optional AI block that must also be in the title
  #   context_terms   must be found in the title or abstract   } these two define
  #   ai_terms        must be found in the title or abstract   } the field baseline
  #
  # Rules for terms: phrases in double quotes, OR in capitals, and no commas
  # or pipe characters. The source matches word stems, so "robot" also finds
  # "robots".
  #
  # STATUS: validated by the query-quality check of 2026-11-12
  # (data/manual/query_quality.csv). Change terms only as a result of a new
  # check, and record the change there.
  context_terms: 'manufacturing OR "industrial production" OR "production line" OR "shop floor" OR factory OR "industry 4.0" OR "smart factory"'
  ai_terms: '"artificial intelligence" OR "machine learning" OR "deep learning" OR "neural network" OR "reinforcement learning" OR "large language model" OR "generative AI" OR "computer vision" OR "random forest" OR "support vector machine" OR LSTM OR "data-driven"'

  # Sub-topics from decision OD-2.
  subtopics:
    - id: predictive_maintenance
      label: Predictive maintenance
      title_terms: '"predictive maintenance" OR "condition monitoring" OR "remaining useful life" OR prognostics'
    - id: visual_quality_inspection
      label: Visual quality inspection
      title_terms: '"quality inspection" OR "visual inspection" OR "defect detection" OR "surface defect"'
    - id: digital_twins
      label: Digital twins
      title_terms: '"digital twin"'
    - id: generative_design
      label: Generative design
      title_terms: '"generative design" OR "topology optimization" OR "topology optimisation"'
    - id: robotics_cobots
      label: Robotics and cobots
      title_terms: '"industrial robot" OR "collaborative robot" OR cobot OR "robotic assembly" OR "human-robot collaboration"'
    - id: process_optimisation
      label: Process optimisation and control
      title_terms: '"process optimization" OR "process optimisation" OR "process control" OR "process monitoring" OR "process parameters"'
    - id: production_planning
      label: Production planning and scheduling
      title_terms: '"production scheduling" OR "production planning" OR "job shop" OR "flow shop"'
    - id: energy_optimisation
      label: Energy optimisation
      title_terms: '"energy efficiency" OR "energy consumption" OR "energy management" OR "energy-efficient" OR "energy saving"'
      # Without this, many works about buildings, farms and power grids match.
      title_also: 'manufacturing OR machining OR industrial OR "production line" OR "production system" OR "machine tool" OR workshop OR steelmaking OR "job shop" OR "flow shop"'
    - id: additive_manufacturing
      label: Additive manufacturing
      title_terms: '"additive manufacturing" OR "3D printing" OR "powder bed fusion" OR "directed energy deposition" OR "fused deposition modeling"'
      # Without this, many general reviews that mention AI in passing match.
      # (An AI block in the title: left out in the robustness test without AI terms.)
      title_ai_terms: 'learning OR neural OR "artificial intelligence" OR AI OR "data-driven" OR "computer vision" OR "machine vision"'
    - id: industrial_copilots
      label: Industrial copilots (large language models on the shop floor)
      title_terms: '"large language model" OR LLM OR "generative AI" OR ChatGPT OR "foundation model"'

scoring:
  # Starting weights from decision OD-5. They must sum to 1.
  weights:
    market_attractiveness: 0.25
    technical_feasibility: 0.25
    strategic_fit: 0.20
    time_to_value: 0.15
    risk: 0.15
  sensitivity_runs: 1000
  random_seed: 42
